pre-commit:
  piped: true
  jobs:
    - name: biome
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.json"
        - "*.jsonc"
      exclude:
        - ".claude/**"
      # --no-errors-on-unmatched: exit 0 (not fail) when every staged file the
      # glob caught turns out to be ignored by biome.json — e.g. a commit that
      # only touches generated JSON biome is configured to skip (stdd's
      # docs/specs/.redteam/ stamps, a built src/styles/output.css). Without it,
      # biome errors "no files were processed" and blocks the commit.
      run: bunx biome check --no-errors-on-unmatched {staged_files}

    - name: dprint
      glob:
        - "*.md"
      exclude:
        - ".claude/**"
      run: bunx dprint check {staged_files}

    # typecheck and test also trigger on dependency and toolchain-config files.
    # A commit that only stages package.json + bun.lock can carry a compiler or
    # library major bump, which breaks compilation and tests without touching a
    # source glob. Before this, such a commit skipped both jobs and shipped
    # unchecked. biome.json is in the set so any toolchain-config commit hits the
    # full gate — one extra typecheck run is cheap next to a config change
    # sliding through.
    - name: typecheck
      glob:
        - "*.ts"
        - "*.tsx"
        - "tsconfig.json"
        - "package.json"
        - "bun.lock"
        - "biome.json"
      run: bun run typecheck

    - name: test
      glob:
        - "*.ts"
        - "*.tsx"
        - "package.json"
        - "bun.lock"
        - "tsconfig.json"
        - "biome.json"
      # Prefer the stdd gate when the stdd plugin is installed: it runs the
      # tiered unit suite, honours .stdd-off, and verifies .stdd-integrity.
      # Fall back to plain `bun test` when stdd isn't present. This lets stdd
      # compose with no hand-wiring and no ordering dependency on
      # `lefthook install` (stdd's setup detects this job as already wired).
      run: 'if [ -x ./scripts/stdd-precommit.sh ]; then ./scripts/stdd-precommit.sh; else bun test; fi'

    - name: build
      glob:
        - "src/**/*.ts"
        - "src/**/*.tsx"
        - "src/**/*.json"
        - "package.json"
        - "bun.lock"
        - "tsconfig.json"
      # The build gate already triggers on package.json, bun.lock and
      # tsconfig.json, so a dependency bump rebuilds. biome.json stays off this
      # list on purpose: lint config never changes the bundle, and build is the
      # slowest job in the gate.
      #
      # Shape-aware: only gate on the build when the project defines a `build`
      # script. App/server/MCP projects that don't bundle simply remove the
      # script and this job no-ops, instead of failing on `bun build src/index.ts`.
      run: 'if grep -q "\"build\":" package.json; then bun run build; fi'
